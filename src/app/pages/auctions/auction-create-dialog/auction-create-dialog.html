<h2 mat-dialog-title>{{ titleText }}</h2>

<div mat-dialog-content>
  <form (ngSubmit)="save()" class="auction-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Item Name</mat-label>
      <input matInput type="text"
             [ngModel]="itemName()" (ngModelChange)="itemName.set($event)"
             name="itemName" required>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Current Price</mat-label>
        <span matTextPrefix>$&nbsp;</span>
        <input matInput type="number"
               [ngModel]="currentPrice()" (ngModelChange)="currentPrice.set($event)"
               name="currentPrice" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-2">
        <mat-label>Auction Site</mat-label>
        <mat-select [ngModel]="auctionSiteId()" (ngModelChange)="auctionSiteId.set($event)"
                    name="auctionSiteId" required>
          @for (site of auctionSites(); track site.id) {
            <mat-option [value]="site.id">{{ site.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-2">
        <mat-label>Auction Link</mat-label>
        <input matInput type="url"
               [ngModel]="auctionLink()" (ngModelChange)="auctionLink.set($event)"
               name="auctionLink" required>
      </mat-form-field>

    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="picker"
               [ngModel]="endTime()" (ngModelChange)="endTime.set($event)"
               name="endTime" required>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>End Time</mat-label>
        <input matInput type="time"
               [ngModel]="endTimeStr()" (ngModelChange)="endTimeStr.set($event)"
               name="endTimeStr" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-2">
        <mat-label>Notes (Optional)</mat-label>
        <input matInput type="text"
               [ngModel]="notes()" (ngModelChange)="notes.set($event)"
               name="notes">
      </mat-form-field>
    </div>

    <!-- Optional image: a link to a photo, e.g. right-click the listing photo > "Copy image address" -->
    <div class="image-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Image Link (Optional)</mat-label>
        <input matInput type="url"
               [ngModel]="imageUrl()" (ngModelChange)="onImageUrlChange($event)"
               name="imageUrl" maxlength="1000"
               placeholder="https://i.ebayimg.com/...">
      </mat-form-field>

      @if (imageUrl().trim()) {
        @if (!imagePreviewFailed()) {
          <img class="image-preview" [src]="imageUrl().trim()" alt="Auction image preview"
               (error)="imagePreviewFailed.set(true)">
        } @else {
          <span class="image-preview-error">Couldn't load that image</span>
        }
      }
    </div>

    <!-- actions live outside content in the next block -->
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="!isFormValid()">
    {{ saveText }}
  </button>
</div>
