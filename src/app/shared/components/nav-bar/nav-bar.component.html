<nav class="navbar">
  <!-- Signed in: the logo takes you to your flips; signed out: the landing page -->
  <a [routerLink]="authService.isLoggedIn() ? '/flips' : '/'" class="brand-link">
    <img src="assets/flipleo.png" class="logo" alt="Flipleo logo">
    <span class="brand">Flipleo</span>
  </a>

  @if (authService.isLoggedIn()) {
    <div class="nav-links">
      <a routerLink="/flips" routerLinkActive="active" class="nav-link">
        <mat-icon>inventory_2</mat-icon> Flips
      </a>
      <a routerLink="/auctions" routerLinkActive="active" class="nav-link">
        <mat-icon>gavel</mat-icon> Auctions
      </a>
      @if (isFeatureActive) {
        <a routerLink="/collection" routerLinkActive="active" class="nav-link">
          <mat-icon>collections</mat-icon> Collection
        </a>
      }
    </div>
  }

  <div class="nav-right">
    @if (authService.isLoggedIn()) {
      <div class="user-info">
        <span class="avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="user-name">{{ authService.userName() }}</span>
        <button mat-icon-button (click)="logout()" title="Log out" aria-label="Log out">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    } @else {
      <a mat-button routerLink="/login">Sign in</a>
      <a mat-flat-button class="fl-primary-button" routerLink="/login" [queryParams]="{ mode: 'register' }">Get started</a>
    }
  </div>
</nav>
