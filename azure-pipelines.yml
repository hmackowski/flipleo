# FlipLeo UI: build on every push to develop/main, deploy to Azure Static Web Apps (flipleo.com) from main.
# Setup: see "FlipLeo Go-Live Guide.docx".

trigger:
  branches:
    include: [ main, develop ]

pr:
  branches:
    include: [ main, develop ]

variables:
  - group: flipleo-production           # Key Vault-linked: SwaDeploymentToken

stages:
  - stage: Build
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: 22.x

          - script: npm ci
            displayName: Install packages

          - script: npx ng build --configuration production
            displayName: Build (production)

          - task: PublishPipelineArtifact@1
            displayName: Upload site
            inputs:
              targetPath: dist/flipleo/browser
              artifact: ui

  - stage: Deploy
    displayName: Deploy to production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployUi
        environment: flipleo-production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureStaticWebApp@0
                  displayName: Deploy to Static Web Apps
                  inputs:
                    cwd: $(Pipeline.Workspace)/ui
                    app_location: /
                    output_location: ''
                    skip_app_build: true      # already built above
                    skip_api_build: true
                    azure_static_web_apps_api_token: $(SwaDeploymentToken)
